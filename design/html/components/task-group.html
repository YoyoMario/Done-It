<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done It - Task Group Component</title>
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body class="task-group-preview">

<!-- Static prototype for the future TaskGroup.razor component. -->
<section class="task-group">
    <header class="task-group-header">
        <div class="task-group-heading">
            <span class="task-group-dot task-group-dot-project" aria-hidden="true"></span>
            <h2 class="task-group-title">Project X</h2>
            <span class="task-group-count">3</span>
        </div>
        <button class="task-group-menu" type="button" aria-label="Project X options">•••</button>
    </header>

    <div class="task-group-list">
        <button class="task-entry is-selected" type="button" aria-pressed="true">
            <span class="task-entry-check" aria-hidden="true"></span>
            <span class="task-entry-content">
                <span class="task-entry-name">Implement SSO callback</span>
                <span class="task-entry-meta">
                    <span>Today</span>
                    <span class="task-entry-tag">#backend</span>
                    <span>3 comments</span>
                </span>
            </span>
            <span class="task-entry-assignees" aria-label="Assigned to John">
                <span class="task-avatar">J</span>
            </span>
            <span class="task-entry-status">In progress</span>
        </button>

        <button class="task-entry is-complete" type="button">
            <span class="task-entry-check" aria-hidden="true"></span>
            <span class="task-entry-content">
                <span class="task-entry-name">Verify mobile navigation</span>
                <span class="task-entry-meta"><span>Completed today</span></span>
            </span>
            <span class="task-entry-assignees"><span class="task-avatar">M</span></span>
            <span class="task-entry-status">Done</span>
        </button>
    </div>
</section>

</body>
</html>
