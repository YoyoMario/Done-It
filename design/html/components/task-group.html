<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done It - Task Group Component</title>
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body class="task-group-preview">

<!-- Static prototype for the future TaskGroup.razor component. -->
<section class="task-group">
    <header class="task-group-header">
        <div class="task-group-heading">
            <span class="task-group-dot task-group-dot-project" aria-hidden="true"></span>
            <h2 class="task-group-title">Project X</h2>
            <span class="task-group-count">3</span>
        </div>
        <button class="task-group-menu" type="button" aria-label="Project X options">•••</button>
    </header>

    <div class="task-group-list">
        <button class="task-entry task-entry-columns is-selected" type="button" aria-pressed="true">
            <span class="task-entry-status">In progress</span>
            <span class="task-entry-name">Implement SSO callback</span>
            <span class="task-entry-added">Aug 27, 2026</span>
            <span class="task-entry-comments">3 comments</span>
            <span class="task-entry-tags"><span class="task-entry-tag">#backend</span></span>
        </button>

        <button class="task-entry task-entry-columns" type="button">
            <span class="task-entry-status task-entry-status-todo">To do</span>
            <span class="task-entry-name">Review navigation keyboard states</span>
            <span class="task-entry-added">Aug 26, 2026</span>
            <span class="task-entry-comments">No comments</span>
            <span class="task-entry-tags"><span class="task-entry-tag">#frontend</span></span>
        </button>

        <button class="task-entry task-entry-columns is-complete" type="button">
            <span class="task-entry-status">Done</span>
            <span class="task-entry-name">Verify mobile navigation</span>
            <span class="task-entry-added">Aug 24, 2026</span>
            <span class="task-entry-comments">1 comment</span>
            <span class="task-entry-tags"><span class="task-entry-tag">#mobile</span></span>
        </button>
    </div>
</section>

</body>
</html>
