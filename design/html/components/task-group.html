<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done It - Task Group Component</title>
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body class="task-group-preview">

<!-- Static prototype for the future TaskGroup.razor component. -->
<section class="task-group">
    <header class="task-group-header">
        <div class="task-group-heading">
            <span class="task-group-dot task-group-dot-project" aria-hidden="true"></span>
            <h2 class="task-group-title">Project X</h2>
            <span class="task-group-count">3</span>
        </div>
        <button class="task-group-menu" type="button" aria-label="Project X options">•••</button>
    </header>

    <div class="task-group-list">
        <div class="task-entry task-entry-columns">
            <details class="task-status-dropdown task-status-dropdown-compact"><summary class="task-status-trigger task-status-progress"><span class="task-status-dot"></span><span>In progress</span><span class="task-status-chevron"></span></summary><div class="task-status-menu"><button class="task-status-option task-status-todo" type="button"><span class="task-status-dot"></span><span>To do</span></button><button class="task-status-option task-status-progress is-selected" type="button"><span class="task-status-dot"></span><span>In progress</span><span class="task-status-selected">✓</span></button><button class="task-status-option task-status-hold" type="button"><span class="task-status-dot"></span><span>On hold</span></button><button class="task-status-option task-status-for-test" type="button"><span class="task-status-dot"></span><span>For test</span></button><button class="task-status-option task-status-in-test" type="button"><span class="task-status-dot"></span><span>In test</span></button><button class="task-status-option task-status-issues" type="button"><span class="task-status-dot"></span><span>Has issues</span></button><button class="task-status-option task-status-completed" type="button"><span class="task-status-dot"></span><span>Completed</span></button></div></details>
            <span class="task-entry-name">Implement SSO callback</span>
            <span class="task-entry-added">Aug 27, 2026</span>
            <span class="task-entry-comments">3 comments</span>
            <span class="task-entry-tags"><span class="task-entry-tag">#backend</span></span>
        </div>

        <div class="task-entry task-entry-columns">
            <details class="task-status-dropdown task-status-dropdown-compact"><summary class="task-status-trigger task-status-todo"><span class="task-status-dot"></span><span>To do</span><span class="task-status-chevron"></span></summary><div class="task-status-menu"><button class="task-status-option task-status-todo is-selected" type="button"><span class="task-status-dot"></span><span>To do</span><span class="task-status-selected">✓</span></button><button class="task-status-option task-status-progress" type="button"><span class="task-status-dot"></span><span>In progress</span></button><button class="task-status-option task-status-hold" type="button"><span class="task-status-dot"></span><span>On hold</span></button><button class="task-status-option task-status-for-test" type="button"><span class="task-status-dot"></span><span>For test</span></button><button class="task-status-option task-status-in-test" type="button"><span class="task-status-dot"></span><span>In test</span></button><button class="task-status-option task-status-issues" type="button"><span class="task-status-dot"></span><span>Has issues</span></button><button class="task-status-option task-status-completed" type="button"><span class="task-status-dot"></span><span>Completed</span></button></div></details>
            <span class="task-entry-name">Review navigation keyboard states</span>
            <span class="task-entry-added">Aug 26, 2026</span>
            <span class="task-entry-comments">No comments</span>
            <span class="task-entry-tags"><span class="task-entry-tag">#frontend</span></span>
        </div>

        <div class="task-entry task-entry-columns is-complete">
            <details class="task-status-dropdown task-status-dropdown-compact"><summary class="task-status-trigger task-status-completed"><span class="task-status-dot"></span><span>Completed</span><span class="task-status-chevron"></span></summary><div class="task-status-menu"><button class="task-status-option task-status-todo" type="button"><span class="task-status-dot"></span><span>To do</span></button><button class="task-status-option task-status-progress" type="button"><span class="task-status-dot"></span><span>In progress</span></button><button class="task-status-option task-status-hold" type="button"><span class="task-status-dot"></span><span>On hold</span></button><button class="task-status-option task-status-for-test" type="button"><span class="task-status-dot"></span><span>For test</span></button><button class="task-status-option task-status-in-test" type="button"><span class="task-status-dot"></span><span>In test</span></button><button class="task-status-option task-status-issues" type="button"><span class="task-status-dot"></span><span>Has issues</span></button><button class="task-status-option task-status-completed is-selected" type="button"><span class="task-status-dot"></span><span>Completed</span><span class="task-status-selected">✓</span></button></div></details>
            <span class="task-entry-name">Verify mobile navigation</span>
            <span class="task-entry-added">Aug 24, 2026</span>
            <span class="task-entry-comments">1 comment</span>
            <span class="task-entry-tags"><span class="task-entry-tag">#mobile</span></span>
        </div>
    </div>
</section>

</body>
</html>
