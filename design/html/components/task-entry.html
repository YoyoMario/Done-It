<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done It - Task Entry Component</title>
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body class="task-entry-preview">

<!-- Static prototype for the future TaskEntry.razor component. -->
<button class="task-entry is-selected" type="button" aria-pressed="true">
    <span class="task-entry-check" aria-hidden="true"></span>
    <span class="task-entry-content">
        <span class="task-entry-name">Implement SSO callback</span>
        <span class="task-entry-meta">
            <span class="task-entry-date">Today</span>
            <span class="task-entry-tag">#backend</span>
            <span class="task-entry-comments">3 comments</span>
        </span>
    </span>
    <span class="task-entry-assignees" aria-label="Assigned to John and Sara">
        <span class="task-avatar">J</span>
        <span class="task-avatar">S</span>
    </span>
    <span class="task-entry-status">In progress</span>
</button>

</body>
</html>
