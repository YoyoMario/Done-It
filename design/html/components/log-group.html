<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>to.do - Log Group Component</title>

    <!--
        Expected structure:

        Project/
        ├── html/
        │   └── components/
        │       └── log-group.html
        │
        └── css/
            ├── app.css
            ├── themes/
            │   └── colors-light.css
            └── components/
                └── log-group.css

        This prototype references app.css.
        app.css should import components/log-group.css and the active theme.
    -->
    <link rel="stylesheet" href="../../css/app.css">
</head>

<body>

    <!--
        LOG GROUP COMPONENT
        Later, move only this <section> into LogGroup.razor.
    -->
    <section class="log-group">

        <header class="group-header">

            <div class="group-title">
                <span class="group-dot group-dot-project"></span>

                <h2
                    class="editable editable-title"
                    contenteditable="true"
                    spellcheck="false">
                    Project X
                </h2>
            </div>

            <div class="group-actions">

                <button
                    class="sync-status sync-status-synced"
                    type="button"
                    aria-label="Synced"
                    title="Synced">
                    ✓
                </button>

                <button
                    class="sync-status sync-status-syncing"
                    type="button"
                    aria-label="Syncing"
                    title="Syncing">
                    <svg
                        class="sync-status-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                    </svg>
                </button>

                <button
                    class="sync-status sync-status-error"
                    type="button"
                    aria-label="Sync error"
                    title="Sync error">
                    !
                </button>

                <button
                    class="group-menu"
                    type="button"
                    aria-label="Group options">
                    •••
                </button>

            </div>

        </header>

        <div class="group-entry-list">

            <article class="group-entry">

                <label class="entry-time-field">
                    <svg class="entry-time-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                    <input
                        class="entry-time"
                        type="time"
                        value="09:15"
                        aria-label="Entry time">
                </label>

                <div
                    class="entry-content editable"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    spellcheck="true">
                    Discussed API changes with <span class="mention">@John</span>.<br>
                    We need to update the authentication flow to support SSO.<br>
                    Add <span
                        class="inline-task"
                        contenteditable="false"
                        role="checkbox"
                        aria-checked="false"
                        tabindex="0">
                        <span class="inline-task-check" aria-hidden="true"></span>
                        <span>Review new API spec</span>
                    </span> before release <span class="tag">#backend</span>
                </div>

            </article>

            <article class="group-entry">

                <label class="entry-time-field">
                    <svg class="entry-time-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                    <input
                        class="entry-time"
                        type="time"
                        value="11:30"
                        aria-label="Entry time">
                </label>

                <div
                    class="entry-content editable"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    spellcheck="true">
                    Frontend sync — dashboard components are almost done.<br>
                    <span class="mention">@Sara</span> will push the last changes.<br>
                    Test collapsible sidebar <span class="tag">#frontend</span>
                </div>

            </article>

            <article class="group-entry empty-entry">

                <label class="entry-time-field">
                    <svg class="entry-time-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 7v5l3 2"></path>
                    </svg>
                    <input
                        class="entry-time"
                        type="time"
                        value="16:20"
                        aria-label="Entry time">
                </label>

                <div
                    class="entry-content empty-entry-input editable is-empty"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    spellcheck="true">
                </div>

            </article>

        </div>

    </section>

</body>
</html>
